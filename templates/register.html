{% extends 'base.html' %}

{% block title %}Register - BodyFit Pro{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-heartbeat fa-3x text-primary mb-3"></i>
                        <h2>Create Account</h2>
                        <p class="text-muted">Join BodyFit Pro and transform your style</p>
                    </div>
                    
                    <form id="registerForm">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" name="first_name" placeholder="First name" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" name="last_name" placeholder="Last name" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-at"></i></span>
                                <input type="text" class="form-control" name="username" placeholder="Choose a username" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" name="password" placeholder="Create password" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" name="confirm_password" placeholder="Confirm password" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">
                                I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>
                        
                        <div class="text-center">
                            <p class="mb-2">Or sign up with</p>
                            <div class="d-flex gap-2 justify-content-center">
                                <button class="btn btn-outline-primary">
                                    <i class="fab fa-google"></i> Google
                                </button>
                                <button class="btn btn-outline-primary">
                                    <i class="fab fa-facebook"></i> Facebook
                                </button>
                                <button class="btn btn-outline-primary">
                                    <i class="fab fa-apple"></i> Apple
                                </button>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <p>Already have an account? <a href="/login/" class="text-decoration-none fw-bold">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    showLoading();
    
    const formData = new FormData(this);
    const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
        password2: formData.get('confirm_password'),
        first_name: formData.get('first_name'),
        last_name: formData.get('last_name')
    };
    
    if (formData.get('password') !== formData.get('confirm_password')) {
        hideLoading();
        showNotification('Passwords do not match!', 'danger');
        return;
    }
    
    axios.post('/api/register/', data)
        .then(response => {
            hideLoading();
            showNotification('Account created successfully! Please login.', 'success');
            setTimeout(() => {
                window.location.href = '/login/';
            }, 1500);
        })
        .catch(error => {
            hideLoading();
            const errors = error.response.data;
            let errorMessage = 'Registration failed. ';
            if (errors) {
                Object.keys(errors).forEach(key => {
                    errorMessage += `${key}: ${errors[key][0]} `;
                });
            }
            showNotification(errorMessage, 'danger');
        });
});
</script>
{% endblock %}
