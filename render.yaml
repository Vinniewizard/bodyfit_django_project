databases:
  - name: bodyfit-db
    databaseName: bodyfit
    user: bodyfit

services:
  - type: web
    name: bodyfit-django
    runtime: python
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT bodyfit.asgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bodyfit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: production
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: PYTHON_VERSION
        value: 3.13.3
